<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trulo — Coming Soon</title>
  <meta name="description" content="Trulo is coming soon. A fresh way to connect with people near you.">
  <meta name="theme-color" content="#222222">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Brand Tokens ─────────────────────────────── */
    :root {
      --black:       #222222;
      --white:       #F5F5F5;
      --dark-grey:   #383838;
      --mid-grey:    #7D7D7D;
      --light-grey:  #DADADA;
      --turquoise:   #81BACB;
      --turquoise-d: #57828F;
      --red-bright:  #E0374D;
      --red-light:   #F6A7B2;
      --green-light: #AEDB98;
      --blue-light:  #B5C5E6;
      --yellow-light:#F1E49C;
      --orange-light:#F4C6B0;
    }

    /* ── Body ─────────────────────────────────────── */
    html, body {
      height: 100%;
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Floating blobs (background atmosphere) ──── */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: var(--turquoise);
      top: -10%; left: -10%;
      animation-duration: 22s;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: var(--red-light);
      bottom: -15%; right: -5%;
      animation-duration: 18s;
      animation-delay: -5s;
    }
    .blob-3 {
      width: 350px; height: 350px;
      background: var(--blue-light);
      top: 60%; left: 10%;
      animation-duration: 25s;
      animation-delay: -10s;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -20px) scale(1.05); }
      100% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ── Content ───────────────────────────────────── */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    /* ── Logo ──────────────────────────────────────── */
    .logo {
      width: min(320px, 70vw);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.2s forwards;
    }

    /* ── Mark (splat icon, decorative) ─────────────── */
    .mark {
      position: absolute;
      z-index: 0;
      width: 280px;
      opacity: 0.04;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      pointer-events: none;
    }

    /* ── Typography ────────────────────────────────── */
    .tagline {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 300;
      color: var(--light-grey);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.5s forwards;
    }

    .coming-soon {
      display: inline-block;
      font-size: clamp(0.75rem, 2vw, 0.9rem);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--turquoise);
      border: 1.5px solid var(--turquoise);
      border-radius: 100px;
      padding: 0.75rem 2.5rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.8s forwards;
      position: relative;
      overflow: hidden;
    }
    .coming-soon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--turquoise);
      opacity: 0.08;
      border-radius: inherit;
    }

    /* ── Colour dots (brand palette accent) ─────── */
    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 3rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 1.1s forwards;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 3s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: var(--red-light);    animation-delay: 0s; }
    .dot:nth-child(2) { background: var(--orange-light); animation-delay: 0.4s; }
    .dot:nth-child(3) { background: var(--yellow-light); animation-delay: 0.8s; }
    .dot:nth-child(4) { background: var(--green-light);  animation-delay: 1.2s; }
    .dot:nth-child(5) { background: var(--blue-light);   animation-delay: 1.6s; }
    .dot:nth-child(6) { background: var(--turquoise);    animation-delay: 2.0s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 0.7; }
      50%      { transform: scale(1.4); opacity: 1; }
    }

    /* ── Fade-up entrance ──────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Footer ────────────────────────────────────── */
    .footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.75rem;
      color: var(--mid-grey);
      z-index: 1;
      opacity: 0;
      animation: fadeUp 1s ease-out 1.4s forwards;
    }
  </style>
</head>
<body>
  <!-- Atmospheric blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Decorative mark -->
  <img class="mark" src="assets/mark_large.png" alt="" aria-hidden="true">

  <!-- Main content -->
  <div class="content">
    <img class="logo" src="assets/logo_large.png" alt="Trulo">

    <p class="tagline">
      A fresh way to connect with<br>the people around you.
    </p>

    <span class="coming-soon">Coming Soon</span>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 Trulo
  </footer>
</body>
</html>
